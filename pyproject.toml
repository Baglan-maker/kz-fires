[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kzfires"
version = "0.1.0"
description = "Satellite fire hotspots for Kazakhstan: static-source mask, event tracking, Telegram alerts"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "numpy>=2.0",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kzfires = "kzfires.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kzfires"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: нужен PostGIS (make db-up)"]
